name: Test, build and push Docker image on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to test and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

concurrency:
  group: e-invoice-validator-release-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/factur-x-xslt/pom.xml

      - name: Check generated Factur-X validators
        run: ./scripts/regenerate-factur-x-xslt.sh --check

      - name: Check generic UBL Greek VAT prefix repair
        run: python3 scripts/repair-en16931-ubl.py --check

      - name: Check configuration and corpus invariants
        run: |
          python3 scripts/check-configuration.py
          python3 scripts/check-upstream-corpus.py
          python3 scripts/test-upstream-api.py --check
          python3 tools/regression-tests/test_api_runner.py

      - name: Run upstream EN16931 and KoSIT rule suites
        run: ./scripts/test-rule-corpora.sh

      - name: Check shell scripts
        run: |
          bash -n validation-api.spec.sh
          bash -n scripts/regenerate-factur-x-xslt.sh
          bash -n scripts/ensure-validator.sh
          bash -n scripts/test-all.sh
          bash -n scripts/test-rule-corpora.sh
          bash -n scripts/test-en16931-rules.sh
          bash -n scripts/test-kosit-rules.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build smoke-test images
        run: |
          docker buildx build --load --platform linux/amd64 --tag e-invoice-validator:smoke-amd64 .
          docker buildx build --load --platform linux/arm64 --tag e-invoice-validator:smoke-arm64 .

      - name: Run API regression suites
        env:
          # ARM64 startup under QEMU is slower than native startup.
          READINESS_TIMEOUT_SECONDS: '600'
        run: |
          set -euo pipefail

          cleanup() {
            result=$?
            if [[ $result -ne 0 ]]; then
              docker logs e-invoice-validator-smoke-amd64 || true
              docker logs e-invoice-validator-smoke-arm64 || true
            fi
            docker rm --force e-invoice-validator-smoke-amd64 >/dev/null 2>&1 || true
            docker rm --force e-invoice-validator-smoke-arm64 >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT

          docker run --detach \
            --platform linux/amd64 \
            --name e-invoice-validator-smoke-amd64 \
            --publish 127.0.0.1:8888:80 \
            e-invoice-validator:smoke-amd64

          API_URL=http://127.0.0.1:8888 ./validation-api.spec.sh
          docker rm --force e-invoice-validator-smoke-amd64

          docker run --detach \
            --platform linux/arm64 \
            --name e-invoice-validator-smoke-arm64 \
            --publish 127.0.0.1:8888:80 \
            e-invoice-validator:smoke-arm64

          API_URL=http://127.0.0.1:8888 ./validation-api.spec.sh

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Determine whether this is the latest stable release
        id: release
        env:
          CURRENT_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_latest=false
          current_version=${CURRENT_TAG#v}
          is_prerelease=$(gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          if [[ "$is_prerelease" == 'false' && "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_version=$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
                | sed 's/^v//' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1
            )
            if [[ "$current_version" == "$latest_version" ]]; then
              publish_latest=true
            fi
          fi
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

      - name: Prepare image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: backofficeplus/e-invoice-validator
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
